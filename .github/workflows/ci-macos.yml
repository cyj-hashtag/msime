name: Korean input transport diagnostic
on:
  push:
    branches:
      - codex/korean-input-probe-20261025
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  settings-probe:
    name: Settings appearance diagnostic
    runs-on: macos-26
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile the real settings appearance test
        run: |
          xcrun clang++ -std=c++17 -fobjc-arc -mmacosx-version-min=13.0 -Wall -Wextra -Werror -UNDEBUG \
            platforms/macos/tests/settings/SettingsGlassTest.mm -framework AppKit -framework WebKit \
            -o "$RUNNER_TEMP/settings-glass-test"
      - name: Require ten consecutive passes
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          executable = pathlib.Path(os.environ['RUNNER_TEMP']) / 'settings-glass-test'
          for iteration in range(10):
              print(f'Settings appearance iteration {iteration + 1}/10', flush=True)
              subprocess.run([str(executable)], check=True, timeout=20)
          PY
  input-probe:
    name: Korean installed input diagnostic
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Download the verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api /repos/metasequoiaime/msime/actions/artifacts/12591511780/zip > "$RUNNER_TEMP/source-build.zip"
      - name: Verify source identity and unpack
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, subprocess, tarfile, zipfile
          root = pathlib.Path.cwd()
          payload = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-build.zip'
          assert hashlib.sha256(payload.read_bytes()).hexdigest() == 'd9b27ad9a2547bda54e04f843bcaa335a00370851a5c3a107f3eaa50891df01d'
          with zipfile.ZipFile(payload) as archive:
              names = {pathlib.Path(name).name: name for name in archive.namelist()}
              head = archive.read(names['korean-system-input-build-head.txt']).decode().strip()
              assert head == 'fb3abba36ee5ed8a75716599fc5e5399da3a4423'
              changed = subprocess.check_output(['git', 'diff', '--name-only', head, 'HEAD'], text=True).splitlines()
              allowed = {'.github/workflows/ci-macos.yml', 'platforms/macos/tests/settings/SettingsGlassTest.mm',
                  'platforms/macos/tests/input/KoreanSystemInputAcceptance.mm', 'platforms/macos/tests/input/KoreanSystemInputAcceptance.md',
                  'platforms/macos/tests/input/run-korean-system-ci.sh'}
              assert all(name in allowed or name.startswith('.agents/notes/') for name in changed), changed
              with tarfile.open(fileobj=io.BytesIO(archive.read(names['korean-system-input-build-x86_64.tar.gz'])), mode='r:gz') as built:
                  built.extractall(root / 'build', filter='data')
          print('Verified product source matches fb3abba3; only test and workflow changes are present')
          PY
      - name: Compile current acceptance client
        run: |
          xcrun clang++ -std=c++17 -fobjc-arc -mmacosx-version-min=13.0 -Wall -Wextra -Werror \
            platforms/macos/tests/input/KoreanSystemInputAcceptance.mm -framework AppKit -framework Carbon \
            -o build/korean-system-input-acceptance.app/Contents/MacOS/korean-system-input-acceptance
          python3 platforms/macos/tests/create_fixture_dictionary.py "$RUNNER_TEMP/msime-pinyin.db"
      - name: Run real installed Korean input
        run: bash platforms/macos/tests/input/run-korean-system-ci.sh build "$RUNNER_TEMP/korean-input-probe"
      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: korean-input-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/korean-input-probe/
          if-no-files-found: warn
          retention-days: 7
